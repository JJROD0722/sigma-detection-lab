title: SSH Failed Password Attempt
id: 48e31b7f-29d4-4d87-9a23-832604fb65c1
status: experimental
description: Detects a failed SSH password authentication attempt.
author: Justin Rodriguez
date: 2026-10-20
logsource:
    product: linux
    service: sshd
detection:
    selection:
        - 'Failed password for '
    condition: selection
falsepositives:
    - Legitimate users entering incorrect passwords
    - Authorized security testing
level: informational
